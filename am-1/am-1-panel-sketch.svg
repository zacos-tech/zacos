<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>AM-1 hardware panel layout</title>
  <desc>A Tonverk-class steel slab with rubber end cheeks: three identical part strips across the top, MASTER and EFFECTS in the middle band, MOD, SEQ buttons, key and scale selectors and a one-octave keyboard in the third band, and seven large degree buttons with RUN along the bottom edge. No screen, no pages; red appears only at the scale selector's FREE detent.</desc>
  <rect width="720" height="470" fill="#16191a"/>
  <text x="40" y="44" fill="#767d81" font-size="12" letter-spacing="2">AM-1 — PANEL LAYOUT · TONVERK-CLASS SLAB · NO SCREEN, NO PAGES</text>

  <!-- rubber end cheeks (colorway panels) -->
  <rect x="22" y="64" width="16" height="348" rx="4" fill="#1b2022" stroke="#363d41" stroke-width="0.8"/>
  <rect x="682" y="64" width="16" height="348" rx="4" fill="#1b2022" stroke="#363d41" stroke-width="0.8"/>

  <!-- chamfered steel plate -->
  <polygon points="56,64 664,64 680,80 680,396 664,412 56,412 40,396 40,80"
    fill="#101314" stroke="#454c50"/>

  <!-- ================= PART STRIPS ================= -->
  <g stroke="#2a3033" fill="none"><rect x="54" y="76" width="196" height="140" rx="3"/>
    <rect x="256" y="76" width="196" height="140" rx="3"/><rect x="458" y="76" width="196" height="140" rx="3"/></g>

  <!-- PART I, fully labeled -->
  <g fill="#4a5155" font-size="6.5" text-anchor="middle">
    <text x="88" y="98">ROLE</text><text x="136" y="98">VOICE</text><text x="184" y="98">PATTERN</text><text x="232" y="98">DIV</text>
    <text x="80" y="198">OCT</text><text x="136" y="198">SHAPE</text><text x="184" y="198">LEVEL</text><text x="227" y="198">ON</text>
  </g>
  <g fill="#1d2123" stroke="#454c50">
    <circle cx="88" cy="118" r="9"/><circle cx="136" cy="118" r="9"/><circle cx="184" cy="118" r="9"/><circle cx="232" cy="118" r="9"/>
  </g>
  <g stroke="#767d81" stroke-width="1.2">
    <line x1="88" y1="118" x2="88" y2="110"/><line x1="136" y1="118" x2="141" y2="111"/>
    <line x1="184" y1="118" x2="184" y2="110"/><line x1="232" y1="118" x2="227" y2="111"/>
  </g>
  <rect x="70" y="162" width="20" height="18" rx="2" fill="#1d2123" stroke="#454c50"/>
  <circle cx="76" cy="171" r="1.4" fill="#767d81"/><circle cx="80" cy="171" r="1.4" fill="#31383c"/><circle cx="84" cy="171" r="1.4" fill="#31383c"/>
  <g fill="#1d2123" stroke="#454c50">
    <circle cx="136" cy="171" r="13"/><circle cx="184" cy="171" r="13"/>
  </g>
  <g stroke="#767d81" stroke-width="1.4"><line x1="136" y1="171" x2="136" y2="160"/><line x1="184" y1="171" x2="190" y2="162"/></g>
  <rect x="214" y="162" width="26" height="18" rx="2" fill="#1d2123" stroke="#454c50"/>
  <circle cx="227" cy="152" r="3" fill="#e8a1a8"/>
  <text x="62" y="209" fill="#767d81" font-size="7.5" letter-spacing="1.5">PART I</text>

  <!-- PART II and III mirror the geometry -->
  <g fill="#1d2123" stroke="#454c50">
    <circle cx="290" cy="118" r="9"/><circle cx="338" cy="118" r="9"/><circle cx="386" cy="118" r="9"/><circle cx="434" cy="118" r="9"/>
    <circle cx="338" cy="171" r="13"/><circle cx="386" cy="171" r="13"/>
    <circle cx="492" cy="118" r="9"/><circle cx="540" cy="118" r="9"/><circle cx="588" cy="118" r="9"/><circle cx="636" cy="118" r="9"/>
    <circle cx="540" cy="171" r="13"/><circle cx="588" cy="171" r="13"/>
  </g>
  <rect x="272" y="162" width="20" height="18" rx="2" fill="#1d2123" stroke="#454c50"/>
  <rect x="416" y="162" width="26" height="18" rx="2" fill="#1d2123" stroke="#454c50"/>
  <circle cx="429" cy="152" r="3" fill="#e8a1a8"/>
  <rect x="474" y="162" width="20" height="18" rx="2" fill="#1d2123" stroke="#454c50"/>
  <rect x="618" y="162" width="26" height="18" rx="2" fill="#1d2123" stroke="#454c50"/>
  <circle cx="631" cy="152" r="3" fill="#e8a1a8"/>
  <text x="264" y="209" fill="#767d81" font-size="7.5" letter-spacing="1.5">PART II</text>
  <text x="466" y="209" fill="#767d81" font-size="7.5" letter-spacing="1.5">PART III</text>

  <!-- ================= MASTER ================= -->
  <rect x="54" y="232" width="340" height="64" rx="3" fill="none" stroke="#2a3033"/>
  <text x="60" y="244" fill="#767d81" font-size="7" letter-spacing="2">MASTER</text>
  <g fill="#1d2123" stroke="#454c50">
    <circle cx="84" cy="266" r="12"/><circle cx="130" cy="266" r="12"/><circle cx="176" cy="266" r="12"/>
    <circle cx="222" cy="266" r="12"/><circle cx="268" cy="266" r="12"/><circle cx="314" cy="266" r="12"/><circle cx="360" cy="266" r="12"/>
  </g>
  <g fill="#4a5155" font-size="6.5" text-anchor="middle">
    <text x="84" y="290">TEMPO</text><text x="130" y="290">SWING</text><text x="176" y="290">DRONE</text>
    <text x="222" y="290">DRIVE</text><text x="268" y="290">CUTOFF</text><text x="314" y="290">RESO</text><text x="360" y="290">OUTPUT</text>
  </g>

  <!-- ================= EFFECTS ================= -->
  <rect x="402" y="232" width="252" height="64" rx="3" fill="none" stroke="#2a3033"/>
  <text x="408" y="244" fill="#767d81" font-size="7" letter-spacing="2">EFFECTS</text>
  <g fill="#1d2123" stroke="#454c50">
    <circle cx="428" cy="266" r="9"/><circle cx="470" cy="266" r="11"/><circle cx="512" cy="266" r="11"/>
    <circle cx="556" cy="266" r="9"/><circle cx="598" cy="266" r="11"/><circle cx="640" cy="266" r="11"/>
  </g>
  <g fill="#4a5155" font-size="6.5" text-anchor="middle">
    <text x="428" y="290">TIME</text><text x="470" y="290">FEEDBK</text><text x="512" y="290">MIX</text>
    <text x="556" y="290">TYPE</text><text x="598" y="290">SIZE</text><text x="640" y="290">MIX</text>
  </g>

  <!-- ================= MOD · SEQ · KEY/SCALE · KEYBOARD ================= -->
  <rect x="54" y="306" width="190" height="52" rx="3" fill="none" stroke="#2a3033"/>
  <text x="60" y="318" fill="#767d81" font-size="7" letter-spacing="2">MOD</text>
  <g fill="#1d2123" stroke="#454c50">
    <circle cx="92" cy="336" r="9"/><circle cx="134" cy="336" r="9"/><circle cx="176" cy="336" r="10"/><circle cx="218" cy="336" r="10"/>
  </g>
  <g fill="#4a5155" font-size="6" text-anchor="middle">
    <text x="92" y="354">WAVE</text><text x="134" y="354">TARGET</text><text x="176" y="354">RATE</text><text x="218" y="354">DEPTH</text>
  </g>

  <rect x="252" y="306" width="134" height="52" rx="3" fill="none" stroke="#2a3033"/>
  <text x="258" y="318" fill="#767d81" font-size="7" letter-spacing="2">SEQ</text>
  <g fill="#1d2123" stroke="#454c50">
    <rect x="260" y="326" width="26" height="14" rx="2"/><rect x="292" y="326" width="26" height="14" rx="2"/>
    <rect x="324" y="326" width="26" height="14" rx="2"/><rect x="356" y="326" width="24" height="14" rx="2"/>
  </g>
  <g fill="#4a5155" font-size="6" text-anchor="middle">
    <text x="273" y="352">REC</text><text x="305" y="352">REST</text><text x="337" y="352">CLR</text><text x="368" y="352">FLW</text>
  </g>

  <rect x="392" y="306" width="86" height="52" rx="3" fill="none" stroke="#2a3033"/>
  <g fill="#1d2123" stroke="#454c50"><circle cx="414" cy="332" r="12"/><circle cx="452" cy="332" r="12"/></g>
  <circle cx="460" cy="341" r="1.8" fill="#c8102e"/>
  <g fill="#4a5155" font-size="6.5" text-anchor="middle"><text x="414" y="354">KEY</text><text x="452" y="354">SCALE</text></g>

  <rect x="486" y="306" width="168" height="52" rx="3" fill="none" stroke="#2a3033"/>
  <g fill="#1d2123" stroke="#3a4145">
    <rect x="492" y="312" width="18" height="38" rx="1"/><rect x="512" y="312" width="18" height="38" rx="1"/>
    <rect x="532" y="312" width="18" height="38" rx="1"/><rect x="552" y="312" width="18" height="38" rx="1"/>
    <rect x="572" y="312" width="18" height="38" rx="1"/><rect x="592" y="312" width="18" height="38" rx="1"/>
    <rect x="612" y="312" width="18" height="38" rx="1"/><rect x="632" y="312" width="18" height="38" rx="1"/>
  </g>
  <g fill="#0c0e0f" stroke="#31383c">
    <rect x="505" y="312" width="10" height="22"/><rect x="525" y="312" width="10" height="22"/>
    <rect x="565" y="312" width="10" height="22"/><rect x="585" y="312" width="10" height="22"/><rect x="605" y="312" width="10" height="22"/>
  </g>

  <!-- ================= PERFORMANCE ROW ================= -->
  <g fill="#1d2123" stroke="#454c50">
    <rect x="54" y="366" width="48" height="34" rx="3"/><rect x="112" y="366" width="48" height="34" rx="3"/>
    <rect x="170" y="366" width="48" height="34" rx="3"/><rect x="228" y="366" width="48" height="34" rx="3"/>
    <rect x="286" y="366" width="48" height="34" rx="3"/><rect x="344" y="366" width="48" height="34" rx="3"/>
    <rect x="402" y="366" width="48" height="34" rx="3"/>
  </g>
  <g fill="#c9ced1" font-size="10" text-anchor="middle">
    <text x="78" y="387">i</text><text x="136" y="387">ii</text><text x="194" y="387">iii</text><text x="252" y="387">iv</text>
    <text x="310" y="387">v</text><text x="368" y="387">vi</text><text x="426" y="387">vii</text>
  </g>
  <polygon points="474,372 580,372 586,378 586,396 580,402 474,402 468,396 468,378"
    fill="none" stroke="#2e3437" stroke-width="0.7"/>
  <text x="527" y="384" fill="#3d4448" font-size="6.5" text-anchor="middle" letter-spacing="2">AM-1</text>
  <text x="527" y="395" fill="#3d4448" font-size="5.5" text-anchor="middle" letter-spacing="1.5">ARPEGGIO MACHINE</text>
  <rect x="600" y="366" width="54" height="34" rx="3" fill="#1d2123" stroke="#454c50"/>
  <circle cx="627" cy="358" r="3" fill="#e8a1a8"/>
  <text x="627" y="387" fill="#c9ced1" font-size="8" text-anchor="middle" letter-spacing="2">RUN</text>

  <text x="360" y="436" fill="#767d81" font-size="10" text-anchor="middle">≈ 360 × 200 mm · 46 controls · three identical part strips, one PCB placed three times</text>
  <text x="360" y="456" fill="#4a5155" font-size="10" text-anchor="middle">reach order: degrees at the near edge, sweeps in the middle, set-and-forget at the top · red lives on one detent: FREE</text>
</svg>
