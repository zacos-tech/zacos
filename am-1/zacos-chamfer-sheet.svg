<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>ZACOS brand shape — chamfered rectangles</title>
  <desc>Four chamfer variants — subtle, standard, elongated octagon, and cassette-shell bottom-only — plus the shape applied as an AM-1 data plate.</desc>
  <rect width="680" height="320" fill="#16191a"/>
  <text x="40" y="40" fill="#767d81" font-size="12" letter-spacing="2">THE SHAPE — CHAMFERED RECTANGLE</text>

  <polygon points="46,70 154,70 160,76 160,124 154,130 46,130 40,124 40,76"
    fill="#1d2123" stroke="#454c50"/>
  <text x="100" y="150" fill="#4a5155" font-size="10" text-anchor="middle">subtle · 6</text>

  <polygon points="214,70 306,70 320,84 320,116 306,130 214,130 200,116 200,84"
    fill="#1d2123" stroke="#454c50"/>
  <text x="260" y="150" fill="#4a5155" font-size="10" text-anchor="middle">standard · 14</text>

  <polygon points="386,70 454,70 480,96 480,104 454,130 386,130 360,104 360,96"
    fill="#1d2123" stroke="#454c50"/>
  <text x="420" y="150" fill="#4a5155" font-size="10" text-anchor="middle">deep · elongated octagon</text>

  <polygon points="520,70 640,70 640,118 628,130 532,130 520,118"
    fill="#1d2123" stroke="#454c50"/>
  <text x="580" y="150" fill="#4a5155" font-size="10" text-anchor="middle">bottom only · cassette shell</text>

  <text x="40" y="196" fill="#767d81" font-size="12" letter-spacing="2">APPLIED — THE DATA PLATE</text>
  <polygon points="54,214 486,214 500,228 500,268 486,282 54,282 40,268 40,228"
    fill="#101314" stroke="#454c50"/>
  <text x="62" y="253" fill="#c9ced1" font-size="15" letter-spacing="6" dominant-baseline="central">AM-1 · ARPEGGIO MACHINE</text>
  <circle cx="478" cy="248" r="3" fill="none" stroke="#767d81" stroke-width="1"/>
  <polygon points="530,214 634,214 644,224 644,272 634,282 530,282 520,272 520,224"
    fill="#101314" stroke="#c8102e"/>
  <text x="582" y="242" fill="#e8a1a8" font-size="11" text-anchor="middle" letter-spacing="3">ZACOS</text>
  <text x="582" y="262" fill="#4a5155" font-size="9" text-anchor="middle" letter-spacing="2">ROME · GA</text>

  <text x="340" y="308" fill="#4a5155" font-size="10" text-anchor="middle">the chamfer is a machining operation — the brand shape is something a mill actually does to steel</text>
</svg>
